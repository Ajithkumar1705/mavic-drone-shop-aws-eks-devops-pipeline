name: ci

on:
  push:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cart: 'cart/**'
            catalogue: 'catalogue/**'
            user: 'user/**'
            payment: 'payment/**'
            shipping: 'shipping/**'
            ratings: 'ratings/**'
            dispatch: 'dispatch/**'
            web: 'web/**'
            mongo: 'mongo/**'
            mysql: 'mysql/**'

  build-scan-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest

    # Required for OIDC — without this, configure-aws-credentials cannot
    # request a token at all, and the job fails before it even tries to
    # authenticate.
    permissions:
      id-token: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # NOTE: no service in this project currently has a real test suite —
      # see HANDOFF.md known-issues section. Placeholder until real tests
      # exist per service.
      - name: Run tests (placeholder)
        run: echo "No test suite configured for ${{ matrix.service }} yet — skipping"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/rs-${{ matrix.service }}:${{ github.sha }} \
            ./${{ matrix.service }}

      # ---- SECURITY SCAN STAGE ----
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/rs-${{ matrix.service }}:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Push image
        if: success()
        run: docker push ${{ steps.login-ecr.outputs.registry }}/rs-${{ matrix.service }}:${{ github.sha }}
