name: ci

on:
  push:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.filter.outputs.changes }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cart: 'cart/**'
            catalogue: 'catalogue/**'
            user: 'user/**'
            payment: 'payment/**'
            shipping: 'shipping/**'
            ratings: 'ratings/**'
            dispatch: 'dispatch/**'
            web: 'web/**'
            mongo: 'mongo/**'
            mysql: 'mysql/**'

  build-scan-push:
    needs: detect-changes

    if: needs.detect-changes.outputs.services != '[]'

    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false

      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # NOTE: No service in this project currently has a real test suite.
      # Placeholder until real tests exist per service.
      - name: Run tests (placeholder)
        run: echo "No test suite configured for ${{ matrix.service }} yet — skipping"

      # AWS authentication using IAM user access keys
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Verify which AWS identity GitHub Actions is using
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # Login to ECR
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build Docker image
      - name: Build image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/rs-${{ matrix.service }}:${{ github.sha }} \
            ./${{ matrix.service }}

      # Security scan
      # Trivy scans the image but does NOT fail the pipeline
      # even if HIGH or CRITICAL vulnerabilities are found.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/rs-${{ matrix.service }}:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # Push image to ECR
      - name: Push image
        if: success()
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/rs-${{ matrix.service }}:${{ github.sha }}