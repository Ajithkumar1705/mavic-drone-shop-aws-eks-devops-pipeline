name: cd

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service to deploy
        required: true
        type: choice
        options:
          - cart
          - catalogue
          - user
          - payment
          - shipping
          - ratings
          - dispatch
          - web
      image_tag:
        description: Git SHA/tag of the image already pushed to ECR
        required: true
        type: string

permissions:
  contents: read

env:
  NAMESPACE: mavic-drone-shop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify image exists
        env:
          SERVICE: ${{ inputs.service }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          aws ecr describe-images             --repository-name "rs-${SERVICE}"             --image-ids imageTag="${IMAGE_TAG}"             --region "${AWS_REGION}"

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig             --name "${{ secrets.EKS_CLUSTER_NAME }}"             --region "${AWS_REGION}"

      - name: Helm lint
        run: |
          helm lint EKS/helm/service             -f "EKS/helm/service/values/${{ inputs.service }}.yaml"

      - name: Render Helm manifest
        env:
          SERVICE: ${{ inputs.service }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          helm template "${SERVICE}" EKS/helm/service             -f "EKS/helm/service/values/${SERVICE}.yaml"             --set service.name="${SERVICE}"             --set image.repository="${REGISTRY}/rs-${SERVICE}"             --set image.tag="${IMAGE_TAG}"

      - name: Deploy only the selected service
        env:
          SERVICE: ${{ inputs.service }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          helm upgrade --install "${SERVICE}" EKS/helm/service             --namespace "${NAMESPACE}"             --create-namespace             -f "EKS/helm/service/values/${SERVICE}.yaml"             --set service.name="${SERVICE}"             --set image.repository="${REGISTRY}/rs-${SERVICE}"             --set image.tag="${IMAGE_TAG}"             --wait             --timeout 10m

      - name: Verify deployment
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          kubectl rollout status             deployment/"${SERVICE}"             -n "${NAMESPACE}"             --timeout=5m

          kubectl get deployment "${SERVICE}"             -n "${NAMESPACE}"             -o wide
