# Source: mavic-drone-shop/templates/web-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    service: web
spec:
  replicas: 1
  selector:
    matchLabels:
      service: web
  template:
    metadata:
      labels:
        service: web
    spec:
      
      containers:
      - name: web
        image: test/rs-web:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 200m
            memory: 100Mi
          requests:
            cpu: 100m
            memory: 50Mi
      # Prometheus sidecar: nginx itself can't run application code, so this
      # translates the existing /nginx_status (stub_status) endpoint —
      # already enabled in default.conf.template — into Prometheus format.
      # Reaches the web container via localhost since sidecars in the same
      # pod share a network namespace.
      - name: nginx-exporter
        image: nginx/nginx-prometheus-exporter:1.3
        args:
        - "-nginx.scrape-uri=http://localhost:8080/nginx_status"
        ports:
        - containerPort: 9113
        resources:
          limits:
            cpu: 50m
            memory: 32Mi
          requests:
            cpu: 25m
            memory: 16Mi
      restartPolicy: Always
---
# Source: mavic-drone-shop/templates/redis-statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    service: redis
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      service: redis
  serviceName: redis
  template:
    metadata:
      labels:
        service: redis
    spec:
      
      containers:
      - name: redis
        image: redis:4.0.6
        imagePullPolicy: Always
        ports:
        - containerPort: 6379
        volumeMounts:
          - name: data
            mountPath: /mnt/redis
        resources:
          limits:
            cpu: 200m
            memory: 100Mi
          requests:
            cpu: 100m
            memory: 50Mi
      restartPolicy: Always
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        
        storageClassName: gp2
        volumeMode: Filesystem
        
        resources:
          requests:
            storage: 1Gi
