# values-dev.yaml
# Overrides for the dev/portfolio environment — used via:
#   helm upgrade --install <service> ./EKS/helm -f values-dev.yaml ...
#
# This exists to demonstrate the actual point of Helm: the SAME chart
# deploys differently per environment without duplicating templates.
# A values-prod.yaml would set these higher (more replicas, real
# resource limits, a real Grafana admin password or alert webhook) once a "prod" tier
# of this project exists.

image:
  pullPolicy: Always # dev environment: always pull the freshly-pushed image, don't trust local caching

nodeport: true # simpler local access for a dev/portfolio cluster than wiring a full LoadBalancer/Ingress

psp:
  enabled: false # PodSecurityPolicy is removed entirely as of Kubernetes 1.25+ — never enable this on the EKS 1.30 cluster this project uses
