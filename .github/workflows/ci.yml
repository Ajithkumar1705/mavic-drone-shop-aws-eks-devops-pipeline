name: ci

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed services
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cart: 'cart/**'
            catalogue: 'catalogue/**'
            user: 'user/**'
            payment: 'payment/**'
            shipping: 'shipping/**'
            ratings: 'ratings/**'
            dispatch: 'dispatch/**'
            web: 'web/**'

  build-scan-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tests
        run: echo "No test suite configured for ${{ matrix.service }} yet"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: |
          docker build             -t ${{ steps.login-ecr.outputs.registry }}/rs-${{ matrix.service }}:${{ github.sha }}             ./${{ matrix.service }}

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/rs-${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Push image
        run: |
          docker push             ${{ steps.login-ecr.outputs.registry }}/rs-${{ matrix.service }}:${{ github.sha }}
